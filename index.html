<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="img/favicon.ico" type="image/x-icon">
  <title>Thomas Lau</title>
  <style>
    @font-face {
      font-family: 'TransportNew';
      src: url('font/TransportNew-Medium.otf') format('opentype');
      font-weight: normal;
      font-style: normal;
    }

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      font-size: 14px;
    }

    body {
      background: #ffffff;
      color: #000000;
      font-family: 'TransportNew', sans-serif;
      line-height: 1.5;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      max-width: 560px;
      width: 100%;
      padding: 1.5rem;
    }

    h1 {
      font-size: 14px;
      font-weight: normal;
      margin-bottom: 1em;
    }

    p + p {
      margin-top: 1em;
    }

    a {
      color: inherit;
      text-decoration: underline;
      text-underline-offset: 0.15em;
    }

    a:hover {
      text-decoration-thickness: 2px;
    }

    @keyframes fade-in {
      from {
        opacity: 0;
        transform: translateY(0.35em);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .line {
      opacity: 0;
      animation: fade-in 0.7s ease forwards;
    }

    .line:nth-child(1) {
      animation-delay: 0.1s;
    }

    .line:nth-child(2) {
      animation-delay: 0.35s;
    }

    .line:nth-child(3) {
      animation-delay: 0.6s;
    }

    @media (prefers-reduced-motion: reduce) {
      .line {
        opacity: 1;
        animation: none;
        transform: none;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="line">Thomas Lau</h1>
    <p class="line">
      Head of Design at <a href="https://trustwallet.com/" target="_blank" rel="noopener noreferrer">Trust Wallet</a>.
      Previously Design Lead at <a href="https://phantom.com/" target="_blank" rel="noopener noreferrer">Phantom</a>,
      and Design Manager at <a href="https://crypto.com/" target="_blank" rel="noopener noreferrer">Crypto.com</a>.
    </p>
    <p class="line">
      Born in Hong Kong. Based in Vancouver.
    </p>
  </div>
</body>
</html>
